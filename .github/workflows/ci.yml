name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request replaces its running checks; every run on main is kept.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders: the build only needs the variables to exist. CI has no secrets.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds the local database from supabase/migrations and supabase/seed.sql. A migration
      # that does not apply to a fresh database fails here.
      - name: Start the local Supabase stack
        run: npx supabase start -x studio,imgproxy,edge-runtime,vector,mailpit,logflare

      # pgTAP tests in supabase/tests/database: RLS policies, triggers and RPCs.
      - name: Run the database tests
        run: npx supabase test db
